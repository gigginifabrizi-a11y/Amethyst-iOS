name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: List available schemes
      run: xcodebuild -list

    - name: Build iOS App
      run: |
        # Replace "YOUR_SCHEME_NAME" once you find it in the logs above
        xcodebuild -scheme "Amethyst" -destination "generic/platform=iOS Simulator" clean build
